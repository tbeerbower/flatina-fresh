spring.application.name=flatina-fresh-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flatina}
spring.datasource.username=${DB_USERNAME:flatina}
spring.datasource.password=${DB_PASSWORD:flatina}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Branches add migrations in parallel; let an older-numbered one that merges later still run.
spring.flyway.out-of-order=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health

# Auth
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION:2592000000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Card scanning (Claude vision)
app.scan.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.scan.model=${SCAN_MODEL:claude-opus-5-5}
app.scan.max-image-px=${SCAN_MAX_IMAGE_PX:2400}
app.scan.stored-image-px=${SCAN_STORED_IMAGE_PX:1600}
