# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flatina
      POSTGRES_USER: flatina
      POSTGRES_PASSWORD: flatina
    ports:
      - "5432:5432"
    volumes:
      - flatina-db:/var/lib/postgresql/data
volumes:
  flatina-db:
