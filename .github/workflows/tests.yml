name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: flatina-fresh-api/pom.xml
      - name: Run Maven tests
        working-directory: flatina-fresh-api
        run: mvn -B verify

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flatina-fresh-client/package-lock.json
      - name: Install, lint and build
        working-directory: flatina-fresh-client
        run: |
          npm ci
          npm run lint
          npm run build
